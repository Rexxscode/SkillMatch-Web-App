openapi: 3.0.0
info:
  title: "SkillMatch API — Dokumentasi Swagger"
  description: |
    Dokumentasi REST API resmi untuk platform **SkillMatch** (Platform Kesiapan Kerja Siswa SMK).

    API ini menyediakan layanan untuk:
    * **Autentikasi** – login, registrasi, keluar, ubah kata sandi, dan reset kata sandi.
    * **Jurusan / Kompetensi Keahlian (Majors)** – data jurusan RPL, DKV, dan TJKT beserta mata pelajaran.
    * **Asesmen (Assessment)** – daftar soal, pengiriman jawaban, dan hasil penilaian kesiapan kerja.
    * **Materi (Learning Materials)** – daftar materi, soal quiz per materi, pengiriman jawaban, dan kelulusan.
    * **Sertifikat (Certificates)** – daftar dan detail sertifikat yang diperoleh siswa.
    * **Roadmap Kesiapan Kerja** – peta perjalanan belajar dan progres pencapaian (milestone).
    * **Portofolio** – kelola proyek siswa dan lihat portofolio publik.
    * **Industri (Perusahaan)** – profil perusahaan, cari kandidat siswa, dan kelola lowongan kerja.
    * **Lowongan Kerja (Jobs)** – daftar lowongan publik, lamaran siswa, dan manajemen pelamar.
    * **Notifikasi** – daftar notifikasi, hitung belum dibaca, dan tandai sudah dibaca.
    * **Admin** – kelola admin, approve/reject perusahaan, verifikasi kartu siswa, kelola soal, dan statistik.

    ## Autentikasi
    Sebagian besar endpoint memerlukan **Bearer Token** (Sanctum).
    Setelah login, gunakan tombol **Authorize** pada UI dan isi token dengan format:
    ```
    Bearer <token>
    ```

    ## Kode Respons Umum
    * `200` – Berhasil.
    * `201` – Berhasil dibuat (created).
    * `401` – Tidak terautentikasi (token tidak valid / kedaluwarsa).
    * `403` – Ditolak (peran tidak memiliki akses).
    * `404` – Data tidak ditemukan.
    * `422` – Validasi gagal (kolom tidak sesuai/terlewat).

    ## Akun Contoh (Seeder)
    * **Siswa:** `budi@student.smk.id` / `Budi@2026!`
    * **Perusahaan:** `hrd@techcorp.com` / `TechCorp@2026!`, `recruit@creativestudio.com` / `Creative@2026!`, `info@telkom.co.id` / `Telkom@2026!`
    * **Admin:** `admin@smk.id` / `Admin@2026!`
  version: "1.0.0"
  contact:
    name: Tim SkillMatch
  license:
    name: Proprietary

servers:
  - url: /api
    description: Server API default (prefix /api)

tags:
  - name: Autentikasi
    description: Endpoint untuk login, registrasi, logout, dan manajemen kata sandi.
  - name: Jurusan
    description: Data kompetensi keahlian (major) dan mata pelajarannya.
  - name: Asesmen
    description: Soal asesmen kesiapan kerja dan pengiriman jawaban.
  - name: Materi
    description: Materi belajar dan quiz per materi.
  - name: Sertifikat
    description: Sertifikat yang diperoleh siswa.
  - name: Roadmap
    description: Roadmap kesiapan kerja dan progres milestone.
  - name: Portofolio
    description: Kelola proyek dan portofolio publik siswa.
  - name: Industri
    description: Profil perusahaan dan pencarian kandidat.
  - name: Lowongan Kerja
    description: CRUD lowongan, lamaran siswa, dan pelamar.
  - name: Notifikasi
    description: Notifikasi pengguna.
  - name: Admin
    description: Manajemen admin dan approval perusahaan.
  - name: Registrasi Kartu
    description: Verifikasi kartu siswa oleh admin dan unggah kartu oleh siswa.
  - name: Manajemen Siswa
    description: Kelola data siswa (kelas/tingkat, avatar).
  - name: Statistik
    description: Statistik dashboard untuk admin.

paths:
  /v1/auth/login:
    post:
      tags: [Autentikasi]
      summary: Login pengguna
      description: Melakukan autentikasi dengan email dan kata sandi untuk mendapatkan token akses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: budi@student.smk.id
                password:
                  type: string
                  format: password
                  example: Budi@2026!
      responses:
        "200":
          description: Login berhasil. Token diberikan untuk akses endpoint terlindungi.
        "401":
          description: Kredensial tidak valid.
        "403":
          description: Akses ditolak (mis. akun belum disetujui).

  /v1/auth/register:
    post:
      tags: [Autentikasi]
      summary: Registrasi pengguna baru
      description: Membuat akun baru untuk siswa atau perusahaan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, role]
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
                role:
                  type: string
                  enum: [student, industry]
                major:
                  type: string
                  description: Kode jurusan (wajib untuk siswa).
                  example: RPL
                grade:
                  type: string
                  description: Tingkat/kelas (wajib untuk siswa).
                  example: XI
                company:
                  type: string
                  description: Nama perusahaan (wajib untuk industri).
      responses:
        "201":
          description: Registrasi berhasil.

  /v1/auth/logout:
    post:
      tags: [Autentikasi]
      summary: Keluar dari sesi
      description: Menghapus token akses pengguna saat ini.
      security:
        - sanctum: []
      responses:
        "200":
          description: Logout berhasil.

  /v1/auth/me:
    get:
      tags: [Autentikasi]
      summary: Profil pengguna saat ini
      description: Mengembalikan data pengguna yang sedang terautentikasi.
      security:
        - sanctum: []
      responses:
        "200":
          description: Data pengguna saat ini.

  /v1/auth/change-password:
    post:
      tags: [Autentikasi]
      summary: Ubah kata sandi
      description: Mengubah kata sandi pengguna saat ini. Berlaku untuk semua peran (siswa, industri, admin).
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, new_password_confirmation]
              properties:
                current_password:
                  type: string
                  format: password
                  description: Kata sandi lama.
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  description: Kata sandi baru (minimal 8 karakter).
                new_password_confirmation:
                  type: string
                  format: password
                  description: Konfirmasi kata sandi baru.
      responses:
        "200":
          description: Kata sandi berhasil diubah.
        "422":
          description: Validasi gagal atau kata sandi lama salah.

  /v1/auth/forgot-password:
    post:
      tags: [Autentikasi]
      summary: Lupa kata sandi
      description: Mengirim tautan/reset token ke email pengguna.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Instruksi reset kata sandi terkirim.

  /v1/auth/reset-password:
    post:
      tags: [Autentikasi]
      summary: Atur ulang kata sandi
      description: Mengatur ulang kata sandi menggunakan token yang dikirim ke email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
      responses:
        "200":
          description: Kata sandi berhasil diatur ulang.
        "422":
          description: Validasi gagal.

  /v1/majors:
    get:
      tags: [Jurusan]
      summary: Daftar jurusan (kompetensi keahlian)
      description: Mengembalikan daftar jurusan yang tersedia. Memerlukan autentikasi admin.
      security:
        - sanctum: []
      responses:
        "200":
          description: Daftar jurusan.

  /v1/majors/{major}/materi:
    get:
      tags: [Jurusan]
      summary: Mata pelajaran per jurusan
      description: Mengembalikan daftar mata pelajaran (materi) untuk suatu jurusan. Memerlukan autentikasi admin.
      security:
        - sanctum: []
      parameters:
        - in: path
          name: major
          required: true
          schema:
            type: string
            enum: [RPL, DKV, TJKT]
          description: Kode jurusan.
      responses:
        "200":
          description: Daftar materi jurusan.

  /v1/assessment/questions/{major}:
    get:
      tags: [Asesmen]
      summary: Daftar soal asesmen
      description: Mengembalikan daftar soal asesmen kesiapan kerja, opsional difilter per jurusan.
      parameters:
        - in: path
          name: major
          required: false
          schema:
            type: string
            enum: [RPL, DKV, TJKT]
          description: Kode jurusan (opsional, kosongkan untuk semua).
      responses:
        "200":
          description: Daftar soal asesmen.

  /v1/assessment/questions/admin/{major}:
    get:
      tags: [Asesmen]
      summary: Daftar soal asesmen (versi admin)
      description: Mengembalikan daftar soal beserta kunci jawaban untuk keperluan administrasi. Memerlukan autentikasi admin.
      security:
        - sanctum: []
      parameters:
        - in: path
          name: major
          required: false
          schema:
            type: string
            enum: [RPL, DKV, TJKT]
          description: Kode jurusan (opsional).
        - in: query
          name: page
          required: false
          schema:
            type: integer
          description: Nomor halaman. Jika diisi, respons dikembalikan per halaman. Tanpa ini, seluruh soal dikembalikan.
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 5
            maximum: 50
          description: Jumlah soal per halaman (default 5, maksimal 50).
        - in: query
          name: skill
          required: false
          schema:
            type: string
          description: Filter berdasarkan skill. meta.skills berisi daftar skill beserta jumlahnya.
      responses:
        "200":
          description: Daftar soal versi admin.

  /v1/assessment/questions:
    post:
      tags: [Asesmen]
      summary: Tambah soal asesmen (admin)
      description: Menambahkan satu soal asesmen. Menghapus hasil asesmen jurusan terkait agar skor dihitung ulang. Memerlukan autentikasi admin.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [major, question, options, correct]
              properties:
                major:
                  type: string
                  enum: [RPL, DKV, TJKT]
                question:
                  type: string
                options:
                  type: array
                  minItems: 2
                  items:
                    type: string
                correct:
                  type: integer
                  description: Indeks jawaban benar di options.
                difficulty:
                  type: string
                  enum: [basic, intermediate, advanced]
                skill:
                  type: string
      responses:
        "201":
          description: Soal berhasil dibuat.
        "422":
          description: Validasi gagal.

  /v1/assessment/questions/{id}:
    patch:
      tags: [Asesmen]
      summary: Ubah soal asesmen (admin)
      description: Memperbarui satu soal asesmen. Menghapus hasil asesmen jurusan terkait agar skor dihitung ulang. Memerlukan autentikasi admin.
      security:
        - sanctum: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID soal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                options:
                  type: array
                  minItems: 2
                  items:
                    type: string
                correct:
                  type: integer
                difficulty:
                  type: string
                skill:
                  type: string
      responses:
        "200":
          description: Soal berhasil diperbarui.
        "422":
          description: Validasi gagal atau soal tidak ditemukan.
    delete:
      tags: [Asesmen]
      summary: Hapus soal asesmen (admin)
      description: Menghapus satu soal asesmen. Menghapus hasil asesmen jurusan terkait agar skor dihitung ulang. Memerlukan autentikasi admin.
      security:
        - sanctum: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID soal.
      responses:
        "200":
          description: Soal berhasil dihapus.
        "422":
          description: Soal tidak ditemukan.

  /v1/assessment/submit:
    post:
      tags: [Asesmen]
      summary: Kirim jawaban asesmen
      description: Mengirim jawaban asesmen untuk mendapatkan skor kesiapan kerja. Memerlukan autentikasi siswa.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [major, answers]
              properties:
                major:
                  type: string
                  enum: [RPL, DKV, TJKT]
                  description: Kode jurusan.
                answers:
                  type: object
                  additionalProperties:
                    type: integer
                  description: Map id-soal ke pilihan jawaban.
      responses:
        "200":
          description: Hasil asesmen.
        "422":
          description: Validasi gagal.

  /v1/assessment/results:
    get:
      tags: [Asesmen]
      summary: Hasil asesmen pengguna
      description: Mengembalikan riwayat hasil asesmen pengguna saat ini. Memerlukan autentikasi siswa.
      security:
        - sanctum: []
      responses:
        "200":
          description: Hasil asesmen.

  /v1/assessment/questions:
    put:
      tags: [Asesmen]
      summary: Perbarui soal asesmen (admin)
      description: Memperbarui daftar soal asesmen untuk suatu jurusan. Memerlukan autentikasi admin.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [major, questions]
              properties:
                major:
                  type: string
                  enum: [RPL, DKV, TJKT]
                questions:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Soal berhasil diperbarui.
        "422":
          description: Validasi gagal.

  /v1/assessment/questions/reset:
    post:
      tags: [Asesmen]
      summary: Reset soal asesmen (admin)
      description: Mengembalikan soal asesmen ke setelan default untuk suatu jurusan. Memerlukan autentikasi admin.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [major]
              properties:
                major:
                  type: string
                  enum: [RPL, DKV, TJKT]
      responses:
        "200":
          description: Soal berhasil direset.
        "422":
          description: Validasi gagal.

  /v1/materi/majors/{major}:
    get:
      tags: [Materi]
      summary: Materi per jurusan
      description: Mengembalikan daftar materi untuk suatu jurusan berdasarkan kode jurusan.
      parameters:
        - in: path
          name: major
          required: true
          schema:
            type: string
            enum: [RPL, DKV, TJKT]
          description: Kode jurusan.
      responses:
        "200":
          description: Daftar materi.

  /v1/materi/{materiId}/questions:
    get:
      tags: [Materi]
      summary: Soal quiz per materi
      description: Mengembalikan daftar soal quiz untuk suatu materi. materiId dapat berupa id atau slug materi. Memerlukan autentikasi siswa.
      security:
        - sanctum: []
      parameters:
        - in: path
          name: materiId
          required: true
          schema:
            type: string
          description: ID atau slug materi.
      responses:
        "200":
          description: Daftar soal materi.
    put:
      tags: [Materi]
      summary: Perbarui soal materi (admin)
      description: Memperbarui daftar soal untuk suatu materi. Memerlukan autentikasi admin.
      security:
        - sanctum: []
      parameters:
        - in: path
          name: materiId
          required: true
          schema:
            type: string
          description: ID atau slug materi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questions]
              properties:
                questions:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Soal berhasil diperbarui.
        "422":
          description: Validasi gagal.

  /v1/materi/{materiId}/questions/admin:
    get:
      tags: [Materi]
      summary: Soal materi (versi admin)
      description: Mengembalikan soal materi beserta kunci jawaban. Memerlukan autentikasi admin.
      security:
        - sanctum: []
      parameters:
        - in: path
          name: materiId
          required: true
          schema:
            type: string
          description: ID atau slug materi.
        - in: query
          name: page
          required: false
          schema:
            type: integer
          description: Nomor halaman. Jika diisi, respons dikembalikan per halaman.
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 5
            maximum: 50
          description: Jumlah soal per halaman (default 5, maksimal 50).
      responses:
        "200":
          description: Soal materi versi admin.

  /v1/materi/{materiId}/questions:
    post:
      tags: [Materi]
      summary: Tambah soal materi (admin)
      description: Menambahkan satu soal ke suatu materi. Memerlukan autentikasi admin.
      security:
        - sanctum: []
      parameters:
        - in: path
          name: materiId
          required: true
          schema:
            type: string
          description: ID atau slug materi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, options, correct]
              properties:
                question:
                  type: string
                options:
                  type: array
                  minItems: 2
                  items:
                    type: string
                correct:
                  type: integer
                  description: Indeks jawaban benar di options.
                difficulty:
                  type: string
                skill:
                  type: string
      responses:
        "201":
          description: Soal berhasil dibuat.
        "422":
          description: Validasi gagal.

  /v1/materi/{materiId}/questions/{id}:
    patch:
      tags: [Materi]
      summary: Ubah soal materi (admin)
      description: Memperbarui satu soal materi. Memerlukan autentikasi admin.
      security:
        - sanctum: []
      parameters:
        - in: path
          name: materiId
          required: true
          schema:
            type: string
          description: ID atau slug materi.
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID soal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                options:
                  type: array
                  minItems: 2
                  items:
                    type: string
                correct:
                  type: integer
                difficulty:
                  type: string
                skill:
                  type: string
      responses:
        "200":
          description: Soal berhasil diperbarui.
        "422":
          description: Validasi gagal atau soal tidak ditemukan.
    delete:
      tags: [Materi]
      summary: Hapus soal materi (admin)
      description: Menghapus satu soal materi. Memerlukan autentikasi admin.
      security:
        - sanctum: []
      parameters:
        - in: path
          name: materiId
          required: true
          schema:
            type: string
          description: ID atau slug materi.
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID soal.
      responses:
        "200":
          description: Soal berhasil dihapus.
        "422":
          description: Soal tidak ditemukan.

  /v1/materi/{materiId}/submit:
    post:
      tags: [Materi]
      summary: Kirim jawaban quiz materi
      description: Mengirim jawaban quiz materi untuk menilai kelulusan. Memerlukan autentikasi siswa.
      security:
        - sanctum: []
      parameters:
        - in: path
          name: materiId
          required: true
          schema:
            type: string
          description: ID atau slug materi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  additionalProperties:
                    type: integer
                  description: Map id-soal ke pilihan jawaban.
      responses:
        "200":
          description: Hasil pengiriman (lulus/tidak lulus).
        "422":
          description: Validasi gagal.

  /v1/materi/{materiId}/questions/reset:
    post:
      tags: [Materi]
      summary: Reset soal materi (admin)
      description: Mengembalikan soal materi ke setelan default. Memerlukan autentikasi admin.
      security:
        - sanctum: []
      parameters:
        - in: path
          name: materiId
          required: true
          schema:
            type: string
          description: ID atau slug materi.
      responses:
        "200":
          description: Soal berhasil direset.

  /v1/certificates:
    get:
      tags: [Sertifikat]
      summary: Daftar sertifikat siswa
      description: Mengembalikan daftar sertifikat yang diperoleh pengguna siswa saat ini. Memerlukan autentikasi siswa.
      security:
        - sanctum: []
      responses:
        "200":
          description: Daftar sertifikat.

  /v1/certificates/{materiId}:
    get:
      tags: [Sertifikat]
      summary: Detail sertifikat per materi
      description: Mengembalikan detail sertifikat untuk suatu materi. Memerlukan autentikasi siswa.
      security:
        - sanctum: []
      parameters:
        - in: path
          name: materiId
          required: true
          schema:
            type: integer
          description: ID materi.
      responses:
        "200":
          description: Detail sertifikat.

  /v1/roadmap:
    get:
      tags: [Roadmap]
      summary: Roadmap kesiapan kerja
      description: Mengembalikan roadmap belajar untuk pengguna siswa, opsional difilter berdasarkan skor asesmen. Memerlukan autentikasi siswa.
      security:
        - sanctum: []
      parameters:
        - in: query
          name: score
          required: false
          schema:
            type: integer
          description: Skor asesmen (untuk menyesuaikan rekomendasi).
      responses:
        "200":
          description: Roadmap dan rekomendasi.

  /v1/roadmap/progress:
    get:
      tags: [Roadmap]
      summary: Progres milestone
      description: Mengembalikan progres pengguna siswa pada roadmap, opsional untuk satu milestone. Memerlukan autentikasi siswa.
      security:
        - sanctum: []
      parameters:
        - in: query
          name: milestone_id
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Progres roadmap.
    post:
      tags: [Roadmap]
