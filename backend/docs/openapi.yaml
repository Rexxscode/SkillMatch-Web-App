components:
  securitySchemes:
    sanctum:
      type: apiKey
      in: header
      name: Authorization
      description: "Token akses dengan format: Bearer <token>"

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    MessageResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            message:
              type: string
              example: "Operasi berhasil"

    DataResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              description: Payload respons yang bervariasi per endpoint.
              nullable: true

    ListWithMetaResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              description: Daftar item.
            meta:
              type: object
              description: Metadata paginasi.

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Login successful"
        data:
          type: object
          properties:
            token:
              type: string
              description: Token akses Bearer.
            user:
              $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [student, industry, admin]

    Questionnaire:
      type: object
      properties:
        id:
          type: integer
        question:
          type: string
        options:
          type: array
          items:
            type: string

    QuestionInput:
      type: object
      properties:
        question:
          type: string
        options:
          type: array
          maxItems: 4
          items:
            type: string
        correct:
          type: integer
          description: Indeks jawaban benar.

    IndustryProfileRequest:
      type: object
      required: [company, industry]
      properties:
